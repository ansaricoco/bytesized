<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByteSized</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f9f9f9;
      text-align: center;
      padding: 20px;
    }
    h1 { color: #333; }
    p { color: #666; margin-bottom: 30px; }
    .btn {
      background-color: #0175C2; /* Flutter Blue */
      color: white;
      padding: 15px 30px;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn:active { background-color: #015a96; }
  </style>

  <script>
    window.onload = function() {
      var search = window.location.search;
      var params = new URLSearchParams(search);

      // Check if this link contains the file 'path' parameter
      if (params.has('path')) {
        var userAgent = navigator.userAgent || navigator.vendor || window.opera;
        var isAndroid = /android/i.test(userAgent);
        var isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

        var customPath = 'bytesized://reconstruct?' + params.toString();
        
        // Update the fallback button link just in case
        document.getElementById("openAppBtn").href = customPath;
        
        if (isAndroid) {
          var intentUrl = 'intent://reconstruct?' + params.toString() + '#Intent;scheme=bytesized;package=com.example.bytesized;end;';
          window.location.href = intentUrl;
        } else if (isIOS) {
          window.location.href = customPath;
        }
      }
    };
  </script>
</head>
<body>
  <h1>You've been invited to ByteSized!</h1>
  <p>If the app doesn't open automatically, tap the button below.</p>
  
  <a href="#" id="openAppBtn" class="btn">Open in App</a>
</body>
</html>
